<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 배경 원 -->
  <circle cx="24" cy="24" r="22" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
  <!-- 위로 향하는 곡선 (S자형, 더 크게) -->
  <path d="M 18 36 C 14 29, 14 19, 18 12" fill="none" stroke="#a16207" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 위 화살표 촉 -->
  <polygon points="18,12 12,18 22,18" fill="#a16207"/>
  <!-- 아래로 향하는 곡선 -->
  <path d="M 30 12 C 34 19, 34 29, 30 36" fill="none" stroke="#a16207" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 아래 화살표 촉 -->
  <polygon points="30,36 24,30 36,30" fill="#a16207"/>
</svg>
