<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 배경 원 -->
  <circle cx="24" cy="24" r="22" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
  <!-- 위로 향하는 곡선 화살표 (왼쪽) -->
  <path d="M 19 34 C 16 28, 16 20, 19 14" fill="none" stroke="#a16207" stroke-width="3" stroke-linecap="round"/>
