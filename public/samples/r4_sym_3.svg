<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  
  <!-- 상단 원호: 몸통 두께 6.5px -->
  <path d="M 50 20 A 30 30 0 0 1 80 50" fill="none" stroke="black" stroke-width="6.5" stroke-linecap="round" />
  <!-- (80, 50) 기준: 약간 더 넓은 날개 각도 (dx = ±10, dy = -8) -->
  <path d="M 70 42 L 80 50 L 90 42" fill="none" stroke="black" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 하단 원호: 몸통 두께 6.5px -->
  <path d="M 50 80 A 30 30 0 0 1 20 50" fill="none" stroke="black" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 30 58 L 20 50 L 10 58" fill="none" stroke="black" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
