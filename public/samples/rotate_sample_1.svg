<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 원형 배경 및 테두리 -->
  <circle cx="24" cy="24" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="2.5" />
  
  <!-- 회전 화살표 기호 (원호 화살표) -->
