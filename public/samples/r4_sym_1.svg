<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  
  <!-- 상단 원호: 몸통 두께 6.2px로 굵직하게 -->
  <path d="M 50 20 A 30 30 0 0 1 80 50" fill="none" stroke="black" stroke-width="6.2" stroke-linecap="round" />
  <!-- (80, 50)에서 수직 아래 접선 기준: 좌우 완벽한 선대칭 (dx = ±8.5, dy = -8.5) -->
  <path d="M 71.5 41.5 L 80 50 L 88.5 41.5" fill="none" stroke="black" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 하단 원호: 몸통 두께 6.2px -->
  <path d="M 50 80 A 30 30 0 0 1 20 50" fill="none" stroke="black" stroke-width="6.2" stroke-linecap="round" />
  <!-- (20, 50)에서 수직 위 접선 기준: 좌우 완벽한 선대칭 (dx = ±8.5, dy = +8.5) -->
  <path d="M 28.5 58.5 L 20 50 L 11.5 58.5" fill="none" stroke="black" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
