<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 배경 원 -->
  <circle cx="24" cy="24" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  
  <!-- 양방향 대각선 크기조절 화살표 (nwse / diagonal) -->
  <line x1="14" y1="34" x2="34" y2="14" stroke="black" stroke-width="3.0" stroke-linecap="round" />
  <!-- 좌하단 화살표 촉 -->
  <polyline points="22,34 14,34 14,26" fill="none" stroke="black" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 우상단 화살표 촉 -->
  <polyline points="26,14 34,14 34,22" fill="none" stroke="black" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" />
</svg>
