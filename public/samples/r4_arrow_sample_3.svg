<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  
  <!-- 상단 원호: R4와 동일한 (50, 20)에서 시작하여 (80, 50)까지 -->
  <path d="M 50 20 A 30 30 0 0 1 80 50" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
  <!-- (80, 50)에서 아래로 향하는 접선에 대한 크기조절 핸들 스타일 폴리라인 촉 -->
  <!-- 아래 방향 접선: 촉 날개는 위쪽/왼쪽 방향으로 뻗음 -->
  <polyline points="72,40 80,50 88,40" fill="none" stroke="black" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 하단 원호: R4와 동일한 (50, 80)에서 시작하여 (20, 50)까지 -->
  <path d="M 50 80 A 30 30 0 0 1 20 50" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
  <!-- (20, 50)에서 위로 향하는 접선에 대한 크기조절 핸들 스타일 폴리라인 촉 -->
  <!-- 위 방향 접선: 촉 날개는 아래쪽/오른쪽 방향으로 뻗음 -->
  <polyline points="28,60 20,50 12,60" fill="none" stroke="black" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
