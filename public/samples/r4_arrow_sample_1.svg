<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  <defs>
    <!-- 크기조절 화살표처럼 날개 각도가 90도 직각이고 끝이 반듯한 marker (8x8 대칭 직각 촉) -->
    <marker id="mRightAngleA" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 8 L 2 14" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="mRightAngleB" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 8 L 2 14" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- R4 본체 원호 그대로 유지 -->
  <path d="M 50 20 A 30 30 0 0 1 80 50" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" marker-end="url(#mRightAngleA)"/>
  <path d="M 50 80 A 30 30 0 0 1 20 50" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" marker-end="url(#mRightAngleB)"/>
</svg>
