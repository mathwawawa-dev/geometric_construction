    <line x1="4.81" y1="8.29" x2="6.34" y2="9.57" stroke="#334155" stroke-width="0.7" />
    <line x1="6.29" y1="6.81" x2="7.57" y2="8.34" stroke="#334155" stroke-width="0.7" />
    <line x1="8.00" y1="5.61" x2="9.00" y2="7.34" stroke="#334155" stroke-width="0.7" />
    <line x1="9.90" y1="4.72" x2="10.58" y2="6.60" stroke="#334155" stroke-width="0.7" />
    <line x1="11.92" y1="4.18" x2="12.26" y2="6.15" stroke="#334155" stroke-width="0.7" />
    <line x1="14.00" y1="4.00" x2="14.00" y2="6.00" stroke="#334155" stroke-width="0.8" />
    <line x1="16.08" y1="4.18" x2="15.74" y2="6.15" stroke="#334155" stroke-width="0.7" />
    <line x1="18.10" y1="4.72" x2="17.42" y2="6.60" stroke="#334155" stroke-width="0.7" />
    <line x1="20.00" y1="5.61" x2="19.00" y2="7.34" stroke="#334155" stroke-width="0.7" />
    <line x1="21.71" y1="6.81" x2="20.43" y2="8.34" stroke="#334155" stroke-width="0.7" />
    <line x1="23.19" y1="8.29" x2="21.66" y2="9.57" stroke="#334155" stroke-width="0.7" />
    <line x1="24.39" y1="10.00" x2="22.66" y2="11.00" stroke="#334155" stroke-width="0.7" />
    <line x1="25.28" y1="11.90" x2="23.40" y2="12.58" stroke="#334155" stroke-width="0.7" />
    <line x1="25.82" y1="13.92" x2="23.85" y2="14.26" stroke="#334155" stroke-width="0.7" />
    <line x1="26.00" y1="16.00" x2="24.00" y2="16.00" stroke="#334155" stroke-width="0.7" />
  </g>

  <!-- ========================================== -->
  <!-- 5. 반원 외곽 호선 및 눈금 밴드 안쪽 호선     -->
  <!-- ========================================== -->
  <!-- 외곽 반원 테두리 호 (반지름 12, 중심 14, 16) -->
  <path d="M 2 16 A 12 12 0 0 1 26 16" stroke="#334155" stroke-width="1.1" stroke-linecap="round" />
  <!-- 눈금 밴드 안쪽 호선 (반지름 10, 중심 14, 16) -->
  <path d="M 4 16 A 10 10 0 0 1 24 16" stroke="#475569" stroke-width="0.7" />

  <!-- ========================================== -->
  <!-- 6. 바닥 중앙 반원 홀 및 바닥 기준선           -->
  <!-- ========================================== -->
  <!-- 바닥 중앙 반원 구멍 (반지름 2.8) -->
  <path d="M 11.2 16 A 2.8 2.8 0 0 1 16.8 16" stroke="#334155" stroke-width="0.9" fill="#ffffff" />
  <!-- 왼쪽 바닥 기준선 -->
  <line x1="2" y1="16" x2="11.2" y2="16" stroke="#334155" stroke-width="1.1" stroke-linecap="round" />
  <!-- 오른쪽 바닥 기준선 -->
  <line x1="16.8" y1="16" x2="26" y2="16" stroke="#334155" stroke-width="1.1" stroke-linecap="round" />
</svg>
