    <line x1="17.11" y1="4.41" x2="16.80" y2="5.57" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="19.07" y1="5.12" x2="18.56" y2="6.21" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="20.88" y1="6.17" x2="20.19" y2="7.15" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="22.49" y1="7.51" x2="21.64" y2="8.36" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="23.83" y1="9.12" x2="22.85" y2="9.81" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="24.88" y1="10.93" x2="23.79" y2="11.44" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="25.59" y1="12.89" x2="24.43" y2="13.20" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="25.95" y1="14.95" x2="24.76" y2="15.06" stroke="#94a3b8" stroke-width="0.4" />
  </g>

  <!-- ========================================== -->
