    <line x1="13.51" y1="13.24" x2="12.26" y2="6.15" stroke="#64748b" stroke-width="0.45" />
    <!-- 90도 수직 기준선 -->
    <line x1="14.00" y1="13.20" x2="14.00" y2="6.00" stroke="#1e293b" stroke-width="0.8" />
    <line x1="14.49" y1="13.24" x2="15.74" y2="6.15" stroke="#64748b" stroke-width="0.45" />
    <line x1="14.96" y1="13.37" x2="17.42" y2="6.60" stroke="#64748b" stroke-width="0.45" />
    <line x1="15.40" y1="13.58" x2="19.00" y2="7.34" stroke="#64748b" stroke-width="0.45" />
    <line x1="15.80" y1="13.86" x2="20.43" y2="8.34" stroke="#64748b" stroke-width="0.45" />
    <line x1="16.14" y1="14.20" x2="21.66" y2="9.57" stroke="#64748b" stroke-width="0.45" />
    <line x1="16.42" y1="14.60" x2="22.66" y2="11.00" stroke="#64748b" stroke-width="0.45" />
    <line x1="16.63" y1="15.04" x2="23.40" y2="12.58" stroke="#64748b" stroke-width="0.45" />
    <line x1="16.76" y1="15.51" x2="23.85" y2="14.26" stroke="#64748b" stroke-width="0.45" />
    <line x1="16.80" y1="16.00" x2="24.00" y2="16.00" stroke="#64748b" stroke-width="0.45" />
  </g>

  <!-- ========================================== -->
  <!-- 3. 5도 단위 미세 눈금 틱                    -->
  <!-- ========================================== -->
  <g id="sub-ticks">
    <line x1="2.05" y1="14.95" x2="3.24" y2="15.06" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="2.41" y1="12.89" x2="3.57" y2="13.20" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="3.12" y1="10.93" x2="4.21" y2="11.44" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="4.17" y1="9.12" x2="5.15" y2="9.81" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="5.51" y1="7.51" x2="6.36" y2="8.36" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="7.12" y1="6.17" x2="7.81" y2="7.15" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="8.93" y1="5.12" x2="9.44" y2="6.21" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="10.89" y1="4.41" x2="11.20" y2="5.57" stroke="#94a3b8" stroke-width="0.4" />
    <line x1="12.95" y1="4.05" x2="13.06" y2="5.24" stroke="#94a3b8" stroke-width="0.4" />
