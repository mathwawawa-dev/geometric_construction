  <!-- ========================================== -->
  <g id="main-ticks">
    <line x1="2.00" y1="16.00" x2="4.00" y2="16.00" stroke="#334155" stroke-width="0.7" />
    <line x1="2.18" y1="13.92" x2="4.15" y2="14.26" stroke="#334155" stroke-width="0.7" />
    <line x1="2.72" y1="11.90" x2="4.60" y2="12.58" stroke="#334155" stroke-width="0.7" />
